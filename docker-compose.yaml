name: n8n-topic-mapping

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: dockerfile
    restart: unless-stopped
    init: true
    environment:
      PORT: "3000"
      N8N_WEBHOOK_URL: "http://n8n:5678/webhook/0e8824b2-8b66-4c84-b143-8ed3863eb4cf"
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      n8n:
        condition: service_started
    networks:
      - topic-mapping

  backend:
    build:
      context: ./backend
      dockerfile: dockerfile
    restart: unless-stopped
    init: true
    environment:
      FRONTEND_PDF_URL: "http://frontend:3000/api/pdf-ready"
      WHISPER_MODEL: "${WHISPER_MODEL:-medium}"
      WHISPER_DEVICE: "${WHISPER_DEVICE:-cpu}"
      WHISPER_COMPUTE_TYPE: "${WHISPER_COMPUTE_TYPE:-int8}"
      WHISPER_LANGUAGE: "${WHISPER_LANGUAGE:-de}"
      HF_HOME: "/root/.cache/huggingface"
      PYTHONUNBUFFERED: "1"
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - whisper-cache:/root/.cache/huggingface
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import json,sys,urllib.request;
          data=json.load(
            urllib.request.urlopen(
              "http://127.0.0.1:8000/health",
              timeout=5
            )
          );
          sys.exit(0 if data.get("ready", True) else 1)
      interval: 60s
      timeout: 8s
      retries: 40
      start_period: 30s


    networks:
      - topic-mapping

  n8n:
    build:
      context: ./n8n
      dockerfile: dockerfile
    restart: unless-stopped
    init: true
    environment:
      BACKEND_BASE_URL: "http://backend:8000"
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "true"

      N8N_ENCRYPTION_KEY: "${N8N_ENCRYPTION_KEY:?N8N_ENCRYPTION_KEY fehlt}"

      N8N_LISTEN_ADDRESS: "0.0.0.0"
      N8N_HOST: "${N8N_HOST:-localhost}"
      N8N_PORT: "5678"
      N8N_PROTOCOL: "${N8N_PROTOCOL:-http}"

      N8N_EDITOR_BASE_URL: "${PUBLIC_N8N_URL:-http://localhost:5678/}"
      WEBHOOK_URL: "${PUBLIC_N8N_URL:-http://localhost:5678/}"

      N8N_SECURE_COOKIE: "${N8N_SECURE_COOKIE:-false}"
      GENERIC_TIMEZONE: "${TZ:-Europe/Berlin}"
      TZ: "${TZ:-Europe/Berlin}"

      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"

      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "168"

    ports:
      - "${N8N_PORT_HOST:-5678}:5678"
    volumes:
      - n8n-data:/home/node/.n8n
    depends_on:
      backend:
        condition: service_healthy
    models:
      qwen25_7b:
        endpoint_var: DMR_OPENAI_BASE_URL
        model_var: DMR_MODEL
    networks:
      - topic-mapping

models:
  qwen25_7b:
    model: ai/qwen2.5:7B-Q4_K_M
    context_size: 8192

networks:
  topic-mapping:
    driver: bridge

volumes:
  n8n-data:
  whisper-cache: